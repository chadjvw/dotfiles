builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "helix", "kcolorscheme", "niri", "qt", "starship", "emacs" ]
enable_community_templates = true
community_ids = [ "discord", "bat", "zed", "zellij" ]
