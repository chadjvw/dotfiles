# [cli.<name>]: every CLI tool, installed on every OS. Skipped when `bin` is already on PATH.
#   bin    binary to look for (default: name)
#   brew, pacman, aur, dnf   native package (default: name; false = not packaged, go straight to mise)
#                            aur = false: not installed on Arch at all
#   mise   mise tool spec (default: name; false = none). A cargo: spec builds from source.
#   cargo  crate to build from source if the mise spec fails
#   source_build  true = a linux-20 script builds it on non-Arch Linux; the tool is left out there
# GUI, fonts, desktop and apps are native-only.

[cli]
angle-grinder = { bin = "agrind", mise = "github:rcoh/angle-grinder", cargo = "ag" }
ast-grep = { bin = "ast-grep", cargo = "ast-grep" }
atuin = { mise = "cargo:atuin" }
aws-cli-v2 = { bin = "aws", brew = "awscli", dnf = "awscli2", mise = "aws-cli" }
bat = {}
bottom = { bin = "btm" }
btop = {}
cargo-cache = { mise = "cargo:cargo-cache" }
cargo-nextest = { mise = "cargo:cargo-nextest" }
cargo-outdated = { mise = "cargo:cargo-outdated" }
cargo-udeps = { mise = "cargo:cargo-udeps" }
cargo-update = { bin = "cargo-install-update", mise = "cargo:cargo-update" }
cargo-watch = { mise = "cargo:cargo-watch" }
chezmoi = {}
curl = { mise = false }
difftastic = { bin = "difft" }
dua-cli = { bin = "dua", mise = "dua" }
duf = {}
emacs = { pacman = "emacs-wayland", mise = false, source_build = true }
et = { brew = "MisterTea/et/et", aur = "eternalterminal", mise = false, source_build = true }
eza = {}
fd = { dnf = "fd-find" }
figlet = { mise = false }
fish = { mise = "github:fish-shell/fish-shell" }
fontconfig = { bin = "fc-list", mise = false }
fzf = {}
git = { mise = false }
git-delta = { bin = "delta", mise = "delta" }
git-lfs = {}
gping = {}
helix = { bin = "hx" }
htop = { mise = false }
jdtls = { mise = false }
jq = {}
jql = { mise = "github:yamafaktory/jql", cargo = "jql" }
jujutsu = { bin = "jj", brew = "jj", mise = "jj" }
just = {}
kotlin-lsp = { brew = "jetbrains/utils/kotlin-lsp", dnf = false, mise = "github:Kotlin/kotlin-lsp" }
less = { mise = false }
logrotate = { mise = false }
macchina = { mise = "github:Macchina-CLI/macchina", cargo = "macchina" }
neovim = { bin = "nvim" }
oha = { cargo = "oha" }
openssh = { bin = "ssh", dnf = "openssh-clients", mise = false }
pandoc = {}
procs = { mise = "github:dalance/procs", cargo = "procs" }
pueue = { mise = "github:Nukesor/pueue", cargo = "pueue" }
restic = {}
rgrc = { brew = false, aur = "rgrc-bin", mise = "cargo:rgrc" }
ripgrep = { bin = "rg" }
rsync = { mise = false }
sd = {}
shellcheck = { dnf = "ShellCheck" }
skim = { bin = "sk", brew = "sk" }
starship = {}
stgit = { bin = "stg", mise = "cargo:stgit" }
taplo = { pacman = "taplo-cli", cargo = "taplo-cli[features=lsp]" }
tealdeer = { bin = "tldr" }
tmux = {}
tokei = {}
topgrade = { aur = "topgrade-bin" }
unison = { dnf = false, mise = "github:bcpierce00/unison[asset_pattern=*x86_64-static.tar.gz]", aur = false }
unison-fsmonitor = { brew = false, mise = "cargo:unison-fsmonitor", aur = false }
usage = {}
uv = {}
watch = { pacman = "procps-ng", dnf = "procps-ng", mise = false }
wget = { mise = false }
xh = {}
xsv = { mise = "github:BurntSushi/xsv", cargo = "xsv" }
yq = {}
zellij = {}
zoxide = {}

[gui]
brew = ["mas", "coreutils", "defaultbrowser"]
brew_cask = [
  "ghostty", "bruno", "keymapp", "zed", "amethyst", "lunar", "shifty", "betterdisplay", "vivaldi", "waterfox", "discord", "spotify", "openlogi",
  "font-iosevka", "font-iosevka-nerd-font", "font-iosevka-slab", "font-iosevka-etoile",
  "font-iosevka-aile", "font-iosevka-curly", "font-iosevka-curly-slab",
  "istat-menus", "visual-studio-code", "jetbrains-toolbox", "bettertouchtool", "bitwarden", "obsidian",
]
# CachyOS: system/kernel/firmware/driver packages are left to CachyOS.
pacman = [
  # editors + theme
  "meld", "zed", "ttf-nerd-fonts-symbols", "adw-gtk-theme",
  # niri desktop
  "niri", "noctalia", "noctalia-greeter", "xwayland-satellite", "xorg-xwayland", "wl-clipboard", "brightnessctl", "pavucontrol", "qt5ct", "kvantum", "xdg-user-dirs", "qt6ct", "polkit-kde-agent",
  # terminals
  "ghostty",
  # fonts
  "ttc-iosevka", "ttf-meslo-nerd", "ttf-fantasque-nerd", "noto-fonts", "noto-fonts-cjk", "noto-fonts-emoji", "otf-font-awesome",
  # apps
  "firefox", "vivaldi", "discord", "signal-desktop", "bitwarden", "spotify-launcher", "vlc-plugins-all", "inkscape", "libreoffice-fresh",
]
aur = ["ghostmirror", "vesktop", "orca-slicer", "zsa-keymapp-bin"]

[gui.mas]
